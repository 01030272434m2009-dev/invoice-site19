<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 ماسح الاتصال بالشاشة البيطرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-light: #f4fbfb;
            --primary-teal: #0d9488;
            --dark-teal: #0f766e;
            --accent-mint: #14b8a6;
            --text-dark: #0f172a;
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background: var(--bg-light); 
            color: var(--text-dark); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            padding: 20px; 
        }

        .header { 
            text-align: center; 
            margin-bottom: 20px; 
        }

        .header h1 { 
            font-size: 1.6rem; 
            color: var(--dark-teal); 
            font-weight: 800; 
            margin-bottom: 6px; 
        }

        .header p { 
            font-size: 0.95rem; 
            color: #64748b; 
            font-weight: 600; 
        }
        
        .scanner-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(13, 148, 136, 0.12);
            border: 1px solid #ccfbf1;
            text-align: center;
        }

        .reader-wrapper {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
        }

        #reader { 
            width: 100%; 
            border: none !important;
        }

        #reader img[alt="Info icon"], #reader span {
            display: none !important;
        }

        .status { 
            margin-top: 18px; 
            font-weight: 700; 
            font-size: 0.95rem;
            color: var(--primary-teal); 
            background: #ccfbf1;
            padding: 14px 16px;
            border-radius: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            word-break: break-all;
        }

        .status.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status.error {
            background: var(--error-bg);
            color: var(--error-text);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🩺 الاقتران بالشاشة الرئيسية</h1>
        <p>وجه الكاميرا نحو كود الـ IP الخاص بالبرنامج</p>
    </div>

    <div class="scanner-card">
        <div class="reader-wrapper">
            <div id="reader"></div>
        </div>
        <div id="status" class="status">📷 جاري تشغيل الكاميرا...</div>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");

        const config = {
            fps: 30,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                const edge = Math.floor(minEdge * 0.75);
                return { width: edge, height: edge };
            },
            videoConstraints: {
                facingMode: "environment",
                focusMode: "continuous",
                width: { min: 640, ideal: 1280, max: 1920 },
                height: { min: 480, ideal: 720, max: 1080 }
            }
        };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
                // إيقاف الماسح بعد القراءة الناجحة
                html5QrCode.stop();

                const statusEl = document.getElementById('status');
                statusEl.innerText = "✅ تم التقاط رابط الاقتران!";
                statusEl.classList.add('success');

                // معالجة رابط الـ IP/WebSocket وإرساله لفتح الاتصال
                handlePairingConnection(decodedText);
            },
            (errorMessage) => {
                // معالجة صامتة أثناء البحث
            }
        ).then(() => {
            document.getElementById('status').innerText = "📷 وجه الكاميرا نحو كود الـ QR الخاص بالبرنامج";
        }).catch((err) => {
            console.error("تعذر تشغيل الكاميرا:", err);
            const statusEl = document.getElementById('status');
            statusEl.innerText = "⚠️ تعذر الوصول للكاميرا، يرجى السماح بالصلاحيات.";
            statusEl.classList.add('error');
        });

        // دالة التعامل مع كود الاقتران المسموح
        function handlePairingConnection(connectionString) {
            console.log("بيانات الاقتران المستلمة:", connectionString);

            // 1. إذا كانت الصفحة مفتوحة من داخل WebBrowser/WebView في البرنامج الرئيسي
            if (window.opener) {
                window.opener.postMessage({ 
                    type: "CONNECT_IP", 
                    payload: connectionString 
                }, "*");

                setTimeout(() => window.close(), 1000);
            } 
            // 2. إذا تم فتح الاتصال مباشرة عبر WebSocket من داخل الموبايل
            else if (connectionString.startsWith("ws://") || connectionString.startsWith("wss://")) {
                connectWebSocketDirectly(connectionString);
            } 
            // 3. إذا كان الرابط IP عالي (HTTP/HTTPS)
            else if (connectionString.startsWith("http://") || connectionString.startsWith("https://")) {
                window.location.href = connectionString;
            } 
            // 4. نص/توكن اقتران خام
            else {
                alert("تم استلام كود الاقتران:\n" + connectionString);
            }
        }

        // دالة اختيارية للربط المباشر بـ WebSocket إن كان الرابط يبدأ بـ ws://
        function connectWebSocketDirectly(wsUrl) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "🔄 جاري إقامة اتصال مباشر بـ WebSocket...";
            
            try {
                const socket = new WebSocket(wsUrl);

                socket.onopen = () => {
                    statusEl.innerText = "🟢 تم الاقتران والاتصال بالسيرفر بنجاح!";
                    socket.send(JSON.stringify({ event: "PAIRED", client: "MobileScanner" }));
                };

                socket.onerror = (error) => {
                    statusEl.innerText = "❌ فشل الاتصال برابط الـ IP الممسوح.";
                    statusEl.classList.remove('success');
                    statusEl.classList.add('error');
                };
            } catch (e) {
                statusEl.innerText = "⚠️ صيغة رابط الاتصال غير مدعومة.";
                statusEl.classList.add('error');
            }
        }
    </script>
</body>
</html>
