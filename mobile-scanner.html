<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 ماسح الاتصال بالشاشة البيطرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-light: #f4fbfb;
            --primary-teal: #0d9488;
            --dark-teal: #0f766e;
            --accent-mint: #14b8a6;
            --text-dark: #0f172a;
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background: var(--bg-light); 
            color: var(--text-dark); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            padding: 20px; 
        }

        .header { 
            text-align: center; 
            margin-bottom: 20px; 
        }

        .header h1 { 
            font-size: 1.6rem; 
            color: var(--dark-teal); 
            font-weight: 800; 
            margin-bottom: 6px; 
        }

        .header p { 
            font-size: 0.95rem; 
            color: #64748b; 
            font-weight: 600; 
        }
        
        .scanner-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(13, 148, 136, 0.12);
            border: 1px solid #ccfbf1;
            text-align: center;
        }

        .reader-wrapper {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
        }

        #reader { 
            width: 100%; 
            border: none !important;
        }

        #reader img[alt="Info icon"], #reader span {
            display: none !important;
        }

        .status { 
            margin-top: 18px; 
            font-weight: 700; 
            font-size: 0.95rem;
            color: var(--primary-teal); 
            background: #ccfbf1;
            padding: 14px 16px;
            border-radius: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            word-break: break-all;
        }

        .status.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status.error {
            background: var(--error-bg);
            color: var(--error-text);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🩺 الاقتران بالشاشة الرئيسية</h1>
        <p>وجه الكاميرا نحو كود الـ QR الخاص بسيرفر البرنامج</p>
    </div>

    <div class="scanner-card">
        <div class="reader-wrapper">
            <div id="reader"></div>
        </div>
        <div id="status" class="status">📷 جاري تشغيل الكاميرا...</div>
    </div>

    <script>
        // 🆔 استخراج رقم جلسة التلفزيون (sid) الممرر في رابط صفحة الموبايل
        const urlParams = new URLSearchParams(window.location.search);
        const targetSid = urlParams.get('sid'); 

        const html5QrCode = new Html5Qrcode("reader");

        const config = {
            fps: 30,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                const edge = Math.floor(minEdge * 0.75);
                return { width: edge, height: edge };
            },
            videoConstraints: {
                facingMode: "environment",
                focusMode: "continuous"
            }
        };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
                html5QrCode.stop();

                const statusEl = document.getElementById('status');
                statusEl.innerText = "⚡ جاري ربط التلفزيون بالسيرفر...";
                statusEl.className = "status";

                // 🎯 معالجة الكود وإرساله للشاشة عبر Relay
                handlePairingConnection(decodedText);
            },
            (errorMessage) => { /* معالجة صامتة أثناء المسح */ }
        ).then(() => {
            document.getElementById('status').innerText = "📷 وجه الكاميرا نحو كود الـ QR الخاص بسيرفر البرنامج";
        }).catch((err) => {
            console.error("تعذر تشغيل الكاميرا:", err);
            const statusEl = document.getElementById('status');
            statusEl.innerText = "⚠️ تعذر الوصول للكاميرا، يرجى السماح بالصلاحيات.";
            statusEl.className = "status error";
        });

        function handlePairingConnection(scannedText) {
            let wsUrl = "";

            try {
                // 1. استخراج رابط الـ WebSocket من الكود الممسوح
                if (scannedText.includes("ws=")) {
                    const params = new URLSearchParams(scannedText.substring(scannedText.indexOf('?')));
                    wsUrl = params.get('ws');
                } 
                else if (scannedText.startsWith("ws://") || scannedText.startsWith("wss://")) {
                    wsUrl = scannedText;
                } 
                else {
                    wsUrl = "ws://" + scannedText;
                }

                console.log("رابط السيرفر المستخرج:", wsUrl);
                const statusEl = document.getElementById('status');

                // 📡 إذا كان لدينا رقم جلسة التلفزيون (targetSid)، نرسل الإشارة عبر PieSocket Relay
                if (targetSid) {
                    const relayWs = new WebSocket("wss://free.piehost.com/v3/channel_relay?api_key=o83A7S2J8E9k&notify_self=0");

                    relayWs.onopen = () => {
                        // إرسال البيانات الموجهة لشاشة التلفزيون المحددة
                        relayWs.send(JSON.stringify({
                            targetSid: targetSid,
                            wsUrl: wsUrl
                        }));

                        statusEl.innerText = "🟢 تم التوصيل! تم إرسال البيانات لشاشة التلفزيون بنجاح.";
                        statusEl.className = "status success";

                        setTimeout(() => {
                            relayWs.close();
                        }, 2000);
                    };

                    relayWs.onerror = (err) => {
                        console.error("Relay Connection Error:", err);
                        statusEl.innerText = "❌ تعذر الاتصال بخادم الإشارات، يرجى المحاولة مجدداً.";
                        statusEl.className = "status error";
                    };

                } else {
                    // 🅰️ Fallback: في حال تم مسح الموبايل مباشرة دون التمرير عبر QR التلفزيون
                    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
                    window.location.href = baseUrl + "/index.html?ws=" + encodeURIComponent(wsUrl);
                }

            } catch (e) {
                console.error("خطأ في معالجة الكود:", e);
                const statusEl = document.getElementById('status');
                statusEl.innerText = "❌ الكود الممسوح غير صالح للاقتران.";
                statusEl.className = "status error";
            }
        }
    </script>
</body>
</html>
